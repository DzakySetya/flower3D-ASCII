<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#03050a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta property="og:title" content="Blue Tulips &amp; Sunflowers — 3D ASCII Bouquet">
  <meta property="og:description" content="Buket tulip biru dominan dengan sentuhan bunga matahari dalam animasi 3D ASCII interaktif.">
  <meta property="og:type" content="website">
  <title>Blue Tulips &amp; Sunflowers — 3D ASCII Bouquet</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2303050a'/%3E%3Cpath d='M32 54V34' stroke='%2322c55e' stroke-width='4' stroke-linecap='round'/%3E%3Cpath d='M32 42c-8-1-12-7-12-13 5 1 9 5 12 10z' fill='%2316a34a'/%3E%3Cpath d='M20 18c0 11 5 18 12 18s12-7 12-18l-6 5-6-9-6 9-6-5z' fill='%233b82f6'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <canvas id="ascii-canvas" aria-label="Animated 3D ASCII bouquet of blue tulips and sunflowers"></canvas>

  <div id="hint" aria-hidden="true">drag to rotate · pinch/scroll to zoom</div>

  <aside id="hud" aria-live="polite">
    <div class="hud-title">tulip_bouquet.ascii</div>
    <div class="hud-line">
      <span id="hud-blooms">blooms open 0/15</span>
      <span class="hud-sep">·</span>
      <span id="hud-petals">petals falling 0</span>
    </div>
    <div class="hud-line hud-sub">
      <span id="hud-meta">12 blue tulips · 3 sunflowers</span>
      <span class="hud-sep">·</span>
      <span id="hud-fps">~60 fps</span>
    </div>
  </aside>

  <nav id="controls" aria-label="Bouquet controls">
    <button id="btn-replay" type="button" title="Replay bloom (R)">replay</button>
    <button id="btn-spin" type="button" title="Toggle auto-rotation (Space)">pause</button>
    <button id="btn-hud" type="button" title="Toggle UI (H)">hide ui</button>
  </nav>
</body>
</html>
